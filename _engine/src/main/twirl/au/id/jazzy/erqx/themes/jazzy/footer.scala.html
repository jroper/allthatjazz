@(blog: Blog, router: Router)

@for(footer <- blog.info.footer) {
    <div class="footer">
        <div class="container">
            <p class="text-muted">
                @Html(footer)
            </p>
        </div>
    </div>
}

<script type="text/javascript" charset="utf-8" src="@router.themeAsset("erqx-jazzy-theme.js")"></script>
<script type="text/javascript">
$(function(){
window.prettyPrint && prettyPrint()
});
</script>
